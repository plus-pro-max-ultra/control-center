<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記帳 改版審閱 v3</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#000;color:#f5f5f7;font:15px/1.5 -apple-system,"PingFang TC",sans-serif}
main{max-width:480px;margin:auto;padding:16px 16px 48px}h1{font-size:18px;margin:8px 0 4px}h2{font-size:16px;margin:28px 0 8px}
p{color:#9a9aa2;margin:4px 0;font-size:13px}.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs label{padding:6px 16px;border-radius:999px;background:#2a2a30;color:#9a9aa2;font-size:13px}
input{position:absolute;opacity:0;pointer-events:none}
img{width:100%;height:auto;border:1px solid #333338;border-radius:12px;display:none}
#day-b:checked~.tabs label[for=day-b],#day-a:checked~.tabs label[for=day-a]{background:#f2b33d;color:#1c1c1c;font-weight:700}#day-b:checked~img.b,#day-a:checked~img.a{display:block}
#records-b:checked~.tabs label[for=records-b],#records-a:checked~.tabs label[for=records-a]{background:#f2b33d;color:#1c1c1c;font-weight:700}#records-b:checked~img.b,#records-a:checked~img.a{display:block}
#report-b:checked~.tabs label[for=report-b],#report-a:checked~.tabs label[for=report-a]{background:#f2b33d;color:#1c1c1c;font-weight:700}#report-b:checked~img.b,#report-a:checked~img.a{display:block}
#budget-b:checked~.tabs label[for=budget-b],#budget-a:checked~.tabs label[for=budget-a]{background:#f2b33d;color:#1c1c1c;font-weight:700}#budget-b:checked~img.b,#budget-a:checked~img.a{display:block}
#receivables-b:checked~.tabs label[for=receivables-b],#receivables-a:checked~.tabs label[for=receivables-a]{background:#f2b33d;color:#1c1c1c;font-weight:700}#receivables-b:checked~img.b,#receivables-a:checked~img.a{display:block}
#schedule-b:checked~.tabs label[for=schedule-b],#schedule-a:checked~.tabs label[for=schedule-a]{background:#f2b33d;color:#1c1c1c;font-weight:700}#schedule-b:checked~img.b,#schedule-a:checked~img.a{display:block}
#settings-b:checked~.tabs label[for=settings-b],#settings-a:checked~.tabs label[for=settings-a]{background:#f2b33d;color:#1c1c1c;font-weight:700}#settings-b:checked~img.b,#settings-a:checked~img.a{display:block}
img.f{display:block;margin:8px 0}</style></head><body><main><h1>記帳 改版審閱 v3</h1><p>第一輪：移除多餘外框、重複的操作列與說明文字。分析、預算主要是密度調整。未做玻璃效果。尚未部署。畫面圖片皆為截圖，僅「改版前／改版後」切換可點按。</p><h2>記帳</h2><div><input type="radio" name="day" id="day-a" checked><input type="radio" name="day" id="day-b"><div class="tabs"><label for="day-a">改版後</label><label for="day-b">改版前</label></div><img class="a" src="img/day-after.png" alt="記帳 改版後"><img class="b" src="img/day-before.png" alt="記帳 改版前"></div><h2>紀錄</h2><div><input type="radio" name="records" id="records-a" checked><input type="radio" name="records" id="records-b"><div class="tabs"><label for="records-a">改版後</label><label for="records-b">改版前</label></div><img class="a" src="img/records-after.png" alt="紀錄 改版後"><img class="b" src="img/records-before.png" alt="紀錄 改版前"></div><h2>分析</h2><div><input type="radio" name="report" id="report-a" checked><input type="radio" name="report" id="report-b"><div class="tabs"><label for="report-a">改版後</label><label for="report-b">改版前</label></div><img class="a" src="img/report-after.png" alt="分析 改版後"><img class="b" src="img/report-before.png" alt="分析 改版前"></div><h2>預算</h2><div><input type="radio" name="budget" id="budget-a" checked><input type="radio" name="budget" id="budget-b"><div class="tabs"><label for="budget-a">改版後</label><label for="budget-b">改版前</label></div><img class="a" src="img/budget-after.png" alt="預算 改版後"><img class="b" src="img/budget-before.png" alt="預算 改版前"></div><h2>待收款</h2><div><input type="radio" name="receivables" id="receivables-a" checked><input type="radio" name="receivables" id="receivables-b"><div class="tabs"><label for="receivables-a">改版後</label><label for="receivables-b">改版前</label></div><img class="a" src="img/receivables-after.png" alt="待收款 改版後"><img class="b" src="img/receivables-before.png" alt="待收款 改版前"></div><h2>排程</h2><div><input type="radio" name="schedule" id="schedule-a" checked><input type="radio" name="schedule" id="schedule-b"><div class="tabs"><label for="schedule-a">改版後</label><label for="schedule-b">改版前</label></div><img class="a" src="img/schedule-after.png" alt="排程 改版後"><img class="b" src="img/schedule-before.png" alt="排程 改版前"></div><h2>設定</h2><div><input type="radio" name="settings" id="settings-a" checked><input type="radio" name="settings" id="settings-b"><div class="tabs"><label for="settings-a">改版後</label><label for="settings-b">改版前</label></div><img class="a" src="img/settings-after.png" alt="設定 改版後"><img class="b" src="img/settings-before.png" alt="設定 改版前"></div><h2>操作流程</h2><p>記帳：點餐別格開啟該筆</p><img class="f" src="img/flow-2-day-tap-meal-opens-record.png" alt="記帳：點餐別格開啟該筆"><p>紀錄：點整列開啟（修改、複製、刪除在此頁內）</p><img class="f" src="img/flow-4-records-row-tap-opens-record.png" alt="紀錄：點整列開啟（修改、複製、刪除在此頁內）"><p>紀錄：日期篩選</p><img class="f" src="img/flow-6-records-date-filter.png" alt="紀錄：日期篩選"><p>新增交易</p><img class="f" src="img/flow-7-new-entry.png" alt="新增交易"><p>新增交易：輸入金額後的預覽</p><img class="f" src="img/flow-8-new-entry-amount.png" alt="新增交易：輸入金額後的預覽"></main></body></html>
